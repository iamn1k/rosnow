<!DOCTYPE html>
<html lang="en">
<head>
    <title>Terrain with Model</title>
    <meta property="og:description" content="Go beyond hillshade and show elevation in actual 3D." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'></script>
    <!--<script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>-->
    <script src="https://unpkg.com/threebox-plugin@2.2.1/dist/threebox.min.js" type="text/javascript"></script>
    <script src="config.js?version=1" type="text/javascript"></script>

    <link href="https://unpkg.com/threebox-plugin@2.2.1/dist/threebox.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            z-index: 1;
        }
        .marker {
            background-color: red;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        #toggle2D {
            position: absolute;
            top: 10.8%;
            z-index: 2;
            margin-left: 97.7%;
            background-color: #ffffff;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        #toggleCameraFollow {
            position: absolute;
            top: 15.8%;
            z-index: 2;
            margin-left: 90.7%;
            background-color: #ffffff;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        #interactivePointContainer {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            z-index: 3;
        }
        #addTowerBtn {
            background-color: lightblue;
            border: 1px solid #ccc;
            padding: 10px;
            cursor: pointer;
        }
        #interactiveTowerContainer {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            z-index: 3;
        }
        #toggleControls {
            position: absolute;
            top: 0px;
            left: 10px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
<button id="toggle2D" style="display: block; margin-top: 10px;">2D</button>
<!--<button id="toggleCameraFollow" style="display: block; margin-top: 10px;">Следовать за самолетом</button> -->
<button id="toggleControls" style="display: block; margin-top: 10px;">Скрыть меню</button>
<div id="controls">
    <h3>Введите координаты</h3>
    <input type="text" id="lat" placeholder="Широта">
    <input type="text" id="lng" placeholder="Долгота">
    <input type="text" id="alt" placeholder="Высота">
    <button id="addPoint">Добавить точку</button>

    <h3>Интерактивное добавление точек</h3>
    <button id="addInteractivePointBtn">Добавить точку интерактивно</button>
    <button id="clearPoints">Удалить точки и маршрут</button>
    <button id="addPathSquere">Добавить зигзаг</button>
    <h3>Выберите самолет</h3>
    <select id="planeSelector">
    <option value="1">Самолет 1</option>
    <option value="2">Самолет 2</option>
</select>
    <h3>Управление полетом</h3>
    <button id="drawPath">Построить путь</button>
    <button id="startFlight" style="display:none;">Начать полет</button>
    
    <h3>Время действия сигнала (sec)</h3>
    <div id="timer">0</div> <!-- Секундомер -->
    <div id="flightTime">Общее время полета: 0.00</div> <!-- Общее время полета -->
    <div id="signalPercentage">Процент времени в сигнале: 0%</div> <!-- Процент времени в сигнале -->

    <div id="signalInfo">
        <div id="signalStrength">Уровень сигнала: -120 дБ</div>
        <div id="noiseLevel">Уровень шума: 0 дБ</div>
    </div>

    <!-- Контейнер для ввода высоты -->
    <div id="interactivePointContainer">
        <label for="pointAlt">Введите высоту:</label>
        <input type="text" id="pointAlt" placeholder="Высота в метрах">
        <button id="addInteractivePoint">Добавить точку</button>
        <button id="cancelInteractivePoint">Отменить</button>
    </div>
    <h3>Интерактивное добавление вышек связи</h3>
    <button id="addTowerBtn">Добавить вышку</button>
    
    <div id="interactiveTowerContainer">
        <h4>Введите Радиус сигнала</h4>
        <!--<label for="towerHeight">Высота:</label>
        <input type="text" id="towerHeight" placeholder="Высота в метрах"><br><br>
        -->
        <label for="signalRadius">Радиус сигнала:</label>
        <input type="text" id="signalRadius" placeholder="Радиус в метрах"><br><br>
        <button id="addInteractiveTower">Добавить вышку</button>
        <button id="cancelInteractiveTower">Отменить</button>
    </div>
    <div id="editPointContainer" style="display: none; position: absolute; background: white; border: 1px solid #ccc; padding: 10px; z-index: 4;">
        <label for="editPointAlt">Изменить высоту:</label>
        <input type="text" id="editPointAlt" placeholder="Высота в метрах">
        <button id="savePointAlt">Сохранить</button>
        <button id="cancelEditPoint">Отменить</button>
    </div>
</div>
<div id="map"></div>

<script type="module">
    

    const krasnoyarskBounds = [
        config.south_coordinates, // Southwest coordinates [lng, lat]
        config.north_coordinates  // Northeast coordinates [lng, lat]
    ];
    console.log("BOunds" + krasnoyarskBounds);

    const map = new maplibregl.Map({
        container: 'map',
        zoom: 12,
        center: config.map_center, // Center coordinates for Krasnoyarsk Krai
        pitch: 70,
        bearing: 0,
        antialias: true,
        style: {
            version: 8,
            sources: {
                osm: {
                    type: 'raster',
                    tiles: [config.tiles], // https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
                    tileSize: 256,
                    attribution: '&copy; OpenStreetMap Contributors',
                    maxzoom: 19
                },
                terrainSource: {
                    type: 'raster-dem',
                    tiles: [
                        'https://tiles.wifidb.net/data/jaxa_terrainrgb/{z}/{x}/{y}.png'
                    ],
                    tileSize: 256
                }
            },
            layers: [
                {
                    id: 'osm',
                    type: 'raster',
                    source: 'osm'
                }
            ],
            terrain: {
                source: 'terrainSource',
                exaggeration: config.exaggeration
            },
            sky: {}
        },
        maxZoom: 18,
        maxPitch: 85,
        maxBounds: krasnoyarskBounds // Restrict map to Krasnoyarsk Krai
    });

    map.addControl(new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
    }));
    document.getElementById('planeSelector').addEventListener('change', (event) => {
        currentPlane = parseInt(event.target.value);
    });
    
    
    document.getElementById('toggleControls').addEventListener('click', function() {
        const controls = document.getElementById('controls');
        const button = document.getElementById('toggleControls');
        
        // Переключаем видимость меню
        if (controls.style.display === 'none') {
            controls.style.display = 'block';
            button.innerText = 'Скрыть меню';  // Меняем текст кнопки на "Скрыть меню"
        } else {
            controls.style.display = 'none';
            button.innerText = 'Показать меню';  // Меняем текст кнопки на "Показать меню"
        }
    });

    document.getElementById('toggle2D').addEventListener('click', () => {
        const currentPitch = map.getPitch();
    
        if (currentPitch > 0) {
            // Переключаем на 2D (вид сверху)
            map.setPitch(0);  // Убираем наклон
            map.setBearing(0);  // Убираем вращение
            map.setZoom(6);  // Устанавливаем обычный масштаб
            document.getElementById('toggle2D').textContent = '3D';
        } else {
            // Переключаем на 3D
            map.setPitch(70);  // Устанавливаем наклон для 3D
            map.setBearing(0);  // Устанавливаем нормальное направление
            map.setZoom(6);  // Масштаб для 3D
            document.getElementById('toggle2D').textContent = '2D';
        }
    });

    const tb = new Threebox(
        map,
        map.getCanvas().getContext('webgl'),
        {
            defaultLights: true
        }
    );
    window.tb = tb;
    const points1 = [];  // Точки для первого самолета
    const points2 = [];  // Точки для второго самолета

    let planeModel1 = null;  // Модель первого самолета
    let planeModel2 = null;  // Модель второго самолета
    let currentPlane = 1;  // Текущий выбранный самолет (по умолчанию самолет 1)

    let currentPointIndex = 0;  // Индекс текущей точки маршрута
    let interactiveMode = false; // Флаг для интерактивного режима

    let activePoint = null;  // Активная точка для редактирования
    let activeMarker = null; // Маркер, который редактируется



    // Array to hold markers
    let markers = [];

    function addMarker(lat, lng, alt) {
        const marker = new maplibregl.Marker({ draggable: true })
            .setLngLat([lng, lat])
            .setPopup(new maplibregl.Popup().setText(`Точка маршрута: [${lat}, ${lng}, ${alt}]`))
            .addTo(map);
    
        // Добавляем обработчик для начала редактирования маркера
        marker.getElement().addEventListener('click', () => {
            editPoint(lat, lng, alt, marker);
        });
    
        // Добавляем обработчик для перемещения маркера
        marker.on('drag', (e) => {
            const newLngLat = e.target.getLngLat();
            // Обновляем координаты точки в массиве
            if (activePoint) {
                activePoint.lat = newLngLat.lat;
                activePoint.lng = newLngLat.lng;
            }
        });
    
        // Вставляем точку в правильный массив в зависимости от выбранного самолета
        if (currentPlane === 1) {
            points1.push({ lat, lng, alt, marker });
        } else {
            points2.push({ lat, lng, alt, marker });
        }
    
        // Добавляем маркер в глобальный массив markers
        markers.push(marker);
    }
    


    // Функция для редактирования высоты точки
    function editPoint(lat, lng, alt, marker) {
        activePoint = points.find(point => point.lat === lat && point.lng === lng);
        activeMarker = marker;
        
        // Показываем форму для редактирования высоты
        document.getElementById('editPointAlt').value = alt;
        document.getElementById('editPointContainer').style.display = 'block';
        
        // Сохраняем изменения в высоте
        document.getElementById('savePointAlt').onclick = () => {
            const newAlt = parseFloat(document.getElementById('editPointAlt').value);
            if (!isNaN(newAlt)) {
                activePoint.alt = newAlt;
                activeMarker.getPopup().setText(`Точка маршрута: [${activePoint.lat}, ${activePoint.lng}, ${newAlt}]`);
                alert(`Высота точки обновлена: ${newAlt} метров`);
                document.getElementById('editPointContainer').style.display = 'none';
            } else {
                alert('Пожалуйста, введите валидную высоту.');
            }
        };

        // Отмена редактирования
        document.getElementById('cancelEditPoint').onclick = () => {
            document.getElementById('editPointContainer').style.display = 'none';
        };
    }

    // Добавляем точку интерактивно
    document.getElementById('addInteractivePointBtn').addEventListener('click', () => {
        interactiveMode = !interactiveMode;
        if (interactiveMode) {
            document.getElementById('interactivePointContainer').style.display = 'block';
            alert("Нажмите на карту, чтобы добавить точку.");
        } else {
            document.getElementById('interactivePointContainer').style.display = 'none';
        }
    });

    // Добавление точки при клике на карту
    map.on('click', (e) => {
        if (interactiveMode) {
            const lat = e.lngLat.lat;
            const lng = e.lngLat.lng;

            // Отобразить форму для ввода высоты
            document.getElementById('interactivePointContainer').style.display = 'block';
            document.getElementById('pointAlt').focus();

            // Сохранить координаты точки
            document.getElementById('addInteractivePoint').onclick = () => {
                const alt = parseFloat(document.getElementById('pointAlt').value);
                if (!isNaN(alt)) {
                    addMarker(lat, lng, alt);
                    alert(`Точка добавлена: [${lat}, ${lng}, ${alt}]`);
                    document.getElementById('interactivePointContainer').style.display = 'none';
                    interactiveMode = false;
                } else {
                    alert("Пожалуйста, введите валидную высоту.");
                }
            };
        }
    });
    let interactiveTowerMode = false; // Флаг для интерактивного добавления вышек

    // Добавление интерактивной вышки связи
    document.getElementById('addTowerBtn').addEventListener('click', () => {
        interactiveTowerMode = !interactiveTowerMode;
        if (interactiveTowerMode) {
            document.getElementById('interactiveTowerContainer').style.display = 'block';
            alert("Нажмите на карту, чтобы добавить вышку.");
        } else {
            document.getElementById('interactiveTowerContainer').style.display = 'none';
        }
    });

    // Отмена добавления вышки
    document.getElementById('cancelInteractiveTower').addEventListener('click', () => {
        interactiveTowerMode = false;
        document.getElementById('interactiveTowerContainer').style.display = 'none';
    });

    // Добавление вышки по клику на карту
    map.on('click', (e) => {
        if (interactiveTowerMode) {
            const lat = e.lngLat.lat;
            const lng = e.lngLat.lng;

            // Отображаем форму для ввода высоты и радиуса
            document.getElementById('interactiveTowerContainer').style.display = 'block';
            document.getElementById('signalRadius').focus();

            document.getElementById('addInteractiveTower').onclick = () => {
                //const height = parseFloat(document.getElementById('towerHeight').value);
                const signalRadius = parseFloat(document.getElementById('signalRadius').value);

                if (!isNaN(signalRadius)) {
                    const feature = {
                        type: "Point",
                        coordinates: [lng, lat],
                        properties: {
                            level: 0,
                            levelHeight: 0,
                            base_height: 0,
                            min_height: 0,
                            height: 0
                        }
                    };
                    // Создание модели вышки связи
                    const pointObj = new THREE.Object3D();
                    const towerHeight = tb.getObjectHeightOnFloor(feature, pointObj, 0);
                    loadTowerModel(lat, lng, towerHeight);



                    // Создание полусферы сигнала
                    createSignalDome(lat, lng, towerHeight, signalRadius);
                    map.addLayer(window.customLayer);
                    //console.log(`Вышка добавлена: [${lat}, ${lng}, ${height}, Signal Radius: ${signalRadius}]`);
                    alert(`Вышка добавлена: [${lat}, ${lng}, ${towerHeight}, Signal Radius: ${signalRadius}]`);
                    window.towers.push({ lat: lat, lng: lng, height: towerHeight, signalRadius });
                    document.getElementById('interactiveTowerContainer').style.display = 'none';
                    interactiveTowerMode = false;
                } else {
                    alert("Пожалуйста, введите валидные данные.");
                }
            };
        }
    });

    // Загрузка модели вышки связи
    function loadTowerModel(lat, lng, alt) {
        const towerModelUrl = config.tower_path; // Укажите правильный путь к вашему файлу GLB
        const options = {
            obj: towerModelUrl,
            type: 'gltf',
            scale: config.tower_scale,
            units: 'meters',
            rotation: { x: 90, y: 0, z: 0 },
            anchor: 'center'
        };
    
        window.tb.loadObj(options, function (model) {
            model.setCoords([lng, lat, alt]); // Устанавливаем координаты с высотой рельефа
            window.tb.add(model);
            window.tb.update();
            console.log("Model loaded at height:", alt);
        });
    }
    
    
    // Создание полусферы сигнала
    function createSignalDome(lat, lng, height, radius) {
        const THREE = window.THREE;

        // Получаем координаты Mercator для положения модели
        const modelOrigin = new maplibregl.LngLat(lng, lat);
        const modelAltitude = height;
        const modelAsMercatorCoordinate = maplibregl.MercatorCoordinate.fromLngLat(modelOrigin, modelAltitude);

        // Параметры трансформации модели для позиционирования, вращения и масштабирования
        const modelTransform = {
            translateX: modelAsMercatorCoordinate.x,
            translateY: modelAsMercatorCoordinate.y,
            translateZ: modelAsMercatorCoordinate.z,
            scale: modelAsMercatorCoordinate.meterInMercatorCoordinateUnits()
        };

        // Функция для создания полусферы
        function createDome(radius) {
            const geometry = new THREE.SphereGeometry(radius, 32, 32, 0, Math.PI, 0, Math.PI); // Полусфера
            const material = new THREE.MeshBasicMaterial({
                color: config.sphere_color,
                transparent: true,
                opacity: config.sphere_opacity,
                side: THREE.DoubleSide
            });
            const dome = new THREE.Mesh(geometry, material);
            return dome;
        }

        // Генерация уникального ID для каждого слоя
        const layerId = 'signal-dome-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);

        // Конфигурация пользовательского слоя для 3D модели
        const customLayer = {
            id: layerId,  // Используем уникальный ID для слоя
            type: 'custom',
            renderingMode: '3d',
            onAdd(map, gl) {
                this.camera = new THREE.Camera();
                this.scene = new THREE.Scene();

                // Создаем два источника света для освещения полусферы
                const directionalLight = new THREE.DirectionalLight(0xffffff);
                directionalLight.position.set(0, -70, 100).normalize();
                this.scene.add(directionalLight);

                const directionalLight2 = new THREE.DirectionalLight(0xffffff);
                directionalLight2.position.set(0, 70, 100).normalize();
                this.scene.add(directionalLight2);

                // Создаем полусферу
                const dome = createDome(radius);

                // Устанавливаем позицию полусферы с учетом координат Mercator и высоты
                dome.position.set(modelTransform.translateX, modelTransform.translateY, modelTransform.translateZ);

                // Добавляем полусферу в сцену
                this.scene.add(dome);

                // Используем canvas карты MapLibre для рендеринга Three.js
                this.renderer = new THREE.WebGLRenderer({
                    canvas: map.getCanvas(),
                    context: gl,
                    antialias: true
                });
                this.renderer.autoClear = false;
            },
            render(gl, matrix) {
                const m = new THREE.Matrix4().fromArray(matrix);
                const l = new THREE.Matrix4()
                    .makeTranslation(modelTransform.translateX, modelTransform.translateY, modelTransform.translateZ)
                    .scale(new THREE.Vector3(modelTransform.scale, -modelTransform.scale, modelTransform.scale));

                this.camera.projectionMatrix = m.multiply(l);
                this.renderer.resetState();
                this.renderer.render(this.scene, this.camera);
            }
        };
        // Добавляем слой немедленно, без ожидания style.load
        //map.addLayer(customLayer);
        window.customLayer = customLayer;
        map.once('style.load', () => {
            map.addLayer(customLayer);
        });
        

    }

    
    
    
    
    
    
    const towers = [];  // Массив для хранения данных о башнях
    window.towers = towers;
    
    
    async function placeTowers(distance, signalRadius) {
        const centerLat = config.map_center[1];
        const centerLng = config.map_center[0];

        const feature = {
            type: "Point",
            coordinates: [centerLng, centerLat],
            properties: {
                level: 0,
                levelHeight: 0,
                base_height: 0,
                min_height: 0,
                height: 0
            }
        };
    
        const pointObj = new THREE.Object3D();
        const centerHeight = await tb.getObjectHeightOnFloor(feature, pointObj, 0);
    
        await loadTowerModel(centerLat, centerLng, centerHeight);
        createSignalDome(centerLat, centerLng, centerHeight, signalRadius);
    
        window.towers.push({ lat: centerLat, lng: centerLng, height: centerHeight, signalRadius });
    
        const bearingOffsets = config.placetowers_angles;
    
        const heightsPromises = bearingOffsets.map(async (angle) => {
            const angleRad = angle * Math.PI / 180;
            const latOffset = Math.sin(angleRad) * (distance / 6371000) * (180 / Math.PI);
            const lngOffset = Math.cos(angleRad) * (distance / 6371000) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
            const newLat = centerLat + latOffset;
            const newLng = centerLng + lngOffset;
    
            const newFeature = {
                type: "Point",
                coordinates: [newLng, newLat],
                properties: {
                    level: 0,
                    levelHeight: 0,
                    base_height: 0,
                    min_height: 0,
                    height: 0
                }
            };
    
            const towerHeight = await tb.getObjectHeightOnFloor(newFeature, pointObj, 0);
            await loadTowerModel(newLat, newLng, towerHeight);
            createSignalDome(newLat, newLng, towerHeight, signalRadius);
    
            window.towers.push({ lat: newLat, lng: newLng, height: towerHeight, signalRadius });
    
            return { newLat, newLng, towerHeight };
        });
    
        const results = await Promise.all(heightsPromises);
        console.log("Towers placed with heights:", results);
        console.log("All Towers:", window.towers);  // Печатаем массив башен для проверки
    }
    
    //placeTowers(config.placetowers_distance, config.tower_radius);
    
    

    map.on('style.load', () => {
        map.addLayer({
            id: 'custom_layer',
            type: 'custom',
            renderingMode: '3d',
            onAdd(map, mbxContext) {
                tb.update();
            },
            render(gl, matrix) {
                tb.update();
            }
        });
    });

    document.getElementById('addPoint').addEventListener('click', () => {
        const lat = parseFloat(document.getElementById('lat').value);
        const lng = parseFloat(document.getElementById('lng').value);
        const alt = parseFloat(document.getElementById('alt').value);
    
        if (!isNaN(lat) && !isNaN(lng) && !isNaN(alt)) {
            if (currentPlane === 1) {
                points1.push({ lat, lng, alt });
            } else {
                points2.push({ lat, lng, alt });
            }
            alert(`Точка добавлена: [${lat}, ${lng}, ${alt}]`);
        } else {
            alert("Пожалуйста, введите валидные координаты.");
        }
    });
    

    let customPathLayers = [];  // Array to store the custom path layers

    function draw3dPath() {
        let points = currentPlane === 1 ? points1 : points2; // Выбираем точки для текущего самолета
    
        if (points.length < 2) {
            alert("Добавьте хотя бы две точки для построения пути.");
            return;
        }

            positions.push(modelAsMercatorCoordinate.x, modelAsMercatorCoordinate.y, modelAsMercatorCoordinate.z);
        });
    
        const geometry = new THREE.BufferGeometry();

            type: 'custom',
            renderingMode: '3d',
            onAdd(map, gl) {
                this.camera = new THREE.Camera();
                this.scene = new THREE.Scene();
    
                const directionalLight = new THREE.DirectionalLight(0xffffff);
                directionalLight.position.set(0, -70, 100).normalize();
                this.scene.add(directionalLight);
    
                const directionalLight2 = new THREE.DirectionalLight(0xffffff);
                directionalLight2.position.set(0, 70, 100).normalize();
                this.scene.add(directionalLight2);
    
                const domeMaterial = new THREE.MeshBasicMaterial({
                    color: config.sphere_color,
                    transparent: true,
                    opacity: 0.5,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });
    
                const domeGeometry = new THREE.SphereGeometry(100, 32, 32, 0, Math.PI, 0, Math.PI);
                const dome = new THREE.Mesh(domeGeometry, domeMaterial);
                dome.position.set(0, 0, 0);
                this.scene.add(line);
                this.scene.add(dome);
    
                this.renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: gl, antialias: true });
                this.renderer.sortObjects = false;
                this.renderer.autoClear = false;
            },
            render(gl, matrix) {
                const m = new THREE.Matrix4().fromArray(matrix);
                this.camera.projectionMatrix = m;
                this.renderer.resetState();
                this.renderer.render(this.scene, this.camera);
            }
        };
    
        // Add custom layer to the map
        map.addLayer(customLayer);
    
        // Store the custom layer's ID for later removal
        customPathLayers.push(layerId);
    
        alert("3D путь построен!");
        document.getElementById('startFlight').style.display = 'inline-block';
    }

// Функция для построения маршрута с зигзагообразными линиями в форме буквы Z
function buildZigzagRoute({ topLeft, bottomRight, numZigZagLines ,heights}) {
    // Очищаем текущие точки
    points.length = 0;

    // Генерация точек для маршрута, которые будут располагаться зигзагообразно в форме Z
    const lat1 = topLeft.lat;
    const lng1 = topLeft.lng;
    const lat2 = bottomRight.lat;
    const lng2 = bottomRight.lng;

    // Шаг для каждой линии по широте и долготе
    const latStep = (lat1 - lat2) / numZigZagLines;  // Шаг по вертикали
    const lngStep = (lng2 - lng1) ;  // Шаг по горизонтали

    let latStart = lat1;
    let lngStart = lng1;

    // Начинаем с верхнего левого угла
    points.push({ lat: latStart, lng: lngStart , alt: heights});

    // Проходим по зигзагообразному маршруту
    for (let i = 0; i < Math.ceil(numZigZagLines / 2); i++) {
        // 1. Двигаемся вправо (по горизонтали)
        lngStart = lngStart + lngStep;
        points.push({ lat: latStart, lng: lngStart, alt: heights });

        // 2. Смещаемся по диагонали вниз влево
        latStart = latStart - latStep;
        lngStart = lngStart - lngStep;
        points.push({ lat: latStart, lng: lngStart, alt: heights });

        // 3. Двигаемся вправо (по горизонтали)
        lngStart = lngStart + lngStep;
        points.push({ lat: latStart, lng: lngStart, alt: heights });

        // 4. Смещаемся по диагонали вниз влево
        latStart = latStart - latStep;
        lngStart = lngStart - lngStep;
        points.push({ lat: latStart, lng: lngStart, alt: heights });
    }

    // После того как точки созданы, вызываем вашу функцию для рисования 3D пути
    draw3dPath();

    // Добавляем маркеры для каждой точки
    points.forEach(point => {
        addMarker(point.lat, point.lng);
    });

    alert("Зигзагообразный маршрут в форме буквы 'Z' построен!");
}

            // Функция для расчета уровня сигнала по логарифмической шкале
            function calculateSignalStrength(distance, signalRadius, minDb = -120, maxDb = 0) {
                // Проверка, если расстояние больше или равно пороговому значению
                if (distance >= signalRadius ) { // * 10 * 2.17
                    return minDb; // Если дистанция больше или равна максимальному радиусу, возвращаем минимальный уровень сигнала
                }

                // Масштабирование от minDb до maxDb
                const maxDistance = signalRadius ;//* 10 * 2.17;
                const signalDb = maxDb - (maxDb - minDb) * (distance / maxDistance); // Линейная интерполяция

                return Math.max(minDb, Math.min(maxDb, signalDb)); // Ограничиваем значения от minDb до maxDb
            }


            // Функция для расчета уровня шума
            function calculateNoiseLevel(signalStrength,minDb = -120) {
                return minDb - signalStrength ;  // Уровень шума обратно пропорционален уровню сигнала
            }
            // Функция для обновления секундомера и уровня сигнала
            function updateSignalInfo(lat, lng, altitude) {
                let signalStrength = -Infinity;
                let noiseLevel = 0;
                for (const tower of window.towers) {
                    // Вычисляем горизонтальное расстояние
                    const horizontalDistance = calculateDistance(lat, lng, tower.lat, tower.lng);
                    // Вычисляем полное 3D расстояние с учетом высоты
                    const verticalDistance = altitude - tower.height;
                    const totalDistance = Math.sqrt(horizontalDistance * horizontalDistance + verticalDistance * verticalDistance);
                    
                    // Получаем уровень сигнала
                    signalStrength = Math.max(signalStrength, calculateSignalStrength(totalDistance, tower.signalRadius));

                    // Получаем уровень шума
                    noiseLevel = calculateNoiseLevel(signalStrength);
                }

                // Отображаем значения на странице
                document.getElementById('signalStrength').textContent = `Уровень сигнала: ${signalStrength.toFixed(2)} дБ`;
                document.getElementById('noiseLevel').textContent = `Уровень шума: ${noiseLevel.toFixed(2)} дБ`;
            }

    
            let isInsideSignal = false;  // Флаг, показывающий, находится ли самолет внутри сферы
            let timeInsideSignal = 0;  // Время внутри сигнала в секундах
            let signalTimer = null;  // Таймер

            // Функция для проверки, находится ли точка внутри полусферы с учетом высоты
            function isInsideSignalDome(lat, lng, altitude) {
                for (const tower of window.towers) {
                    // Расстояние по горизонтали (поверхность Земли)
                    const horizontalDistance = calculateDistance(lat, lng, tower.lat, tower.lng);
                    
                    // Разница в высоте
                    const verticalDistance = altitude - tower.height;

                    // Полное трехмерное расстояние с учетом горизонтального и вертикального расстояний
                    const distance = Math.sqrt(Math.pow(horizontalDistance, 2) + Math.pow(verticalDistance, 2));

                    //console.log(`Horizontal Distance: ${horizontalDistance}, Vertical Distance: ${verticalDistance}, Total Distance: ${distance}`);
                    
                    // Проверяем, если расстояние меньше или равно радиусу сигнала
                    if (distance <= tower.signalRadius ) { //  * 10 * 2.17
                        //console.log("inside sphere!!!");
                        return true;  // Если самолет находится внутри хотя бы одной сферы
                    }
                }
                return false;  // Если самолет вне всех сфер
            }


            // Функция для обновления секундомера
            function updateTimer() {
                const timerElement = document.getElementById('timer');
                if (isInsideSignal) {
                    timeInsideSignal += 0.1;  // Увеличиваем время на 0.1 секунды (каждую десятую долю)
                    timerElement.textContent = timeInsideSignal.toFixed(2);  // Отображаем время с точностью до сотых
                }
            }

            let followCamera = false;  // Переменная для отслеживания режима следования камеры

            // Обработчик кнопки переключения следования камеры
//            document.getElementById('toggleCameraFollow').addEventListener('click', () => {
//                followCamera = !followCamera;  // Переключаем режим
//                const buttonText = followCamera ? 'Не следовать за самолетом' : 'Следовать за самолетом';
//                document.getElementById('toggleCameraFollow').textContent = buttonText;
//            });

            // Параметры смещения камеры относительно самолета
            const cameraOffset = config.plane_camera_offset;
            function startFlightForPlane(currentPlane, points1, points2) {
                const points = planeNumber === 1 ? points1 : points2;
                window.points = points;
                const model = planeNumber === 1 ? planeModel1 : planeModel2; // Для первого или второго самолета
            
                if (points.length < 2) {
                    alert("Добавьте точки маршрута.");
                    return;
                }
            
                const options = {
                    obj: config.plane_path,
                    type: 'gltf',
                    scale: config.plane_scale,
                    units: 'meters',
                    rotation: config.plane_rotation,
                    anchor: 'center'
                };
            
                window.tb.loadObj(options, function (model) {
                    model.setCoords([points[0].lng, points[0].lat, points[0].alt]);
                    window.tb.add(model);
                    window.tb.update();
            
                    // Запуск анимации для выбранного самолета
                    animateForPlane(model, points);
                });
            }
            function animateForPlane(model, points) {
                let startTime = performance.now();
                let totalDistance = 0;
                for (let i = 0; i < points.length - 1; i++) {
                    totalDistance += calculateDistance(
                        points[i].lat, points[i].lng,
                        points[i + 1].lat, points[i + 1].lng
                    );
                }
            
                const flightSpeed = config.plane_flight_speed / 3.6;
                const duration = totalDistance / flightSpeed * 1000;
            
                let progress = 0;
                let currentSegment = 0;
            
                function interpolate(p1, p2, progress) {
                    return {
                        lat: p1.lat + (p2.lat - p1.lat) * progress,
                        lng: p1.lng + (p2.lng - p1.lng) * progress,
                        alt: p1.alt + (p2.alt - p1.alt) * progress,
                    };
                }
            
                function animate() {
                    const currentTime = performance.now();
                    const elapsedTime = currentTime - startTime;
                    progress = Math.min(elapsedTime / duration, 1);
            
                    let segmentProgress = (elapsedTime / duration) * (points.length - 1);
                    currentSegment = Math.floor(segmentProgress);
                    let nextSegment = currentSegment + 1;
                    if (nextSegment >= points.length) {
                        nextSegment = points.length - 1;
                    }
            
                    let p1 = points[currentSegment];
                    let p2 = points[nextSegment];
                    const segmentProgressNormalized = segmentProgress - currentSegment;
                    const pos = interpolate(p1, p2, segmentProgressNormalized);
                    model.setCoords([pos.lng, pos.lat, pos.alt]);
            
                    window.tb.update();
            
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        alert(`Полет ${currentPlane} завершен!`);
                    }
                }
            
                animate();
            }
                        
            // Обновленная анимация полета
            function animate() {
                const currentTime = performance.now();
                const elapsedTime = currentTime - startTime;
                progress = Math.min(elapsedTime / duration, 1);

                // Находим текущий сегмент пути
                let segmentProgress = (elapsedTime / duration) * (points.length - 1);
                currentSegment = Math.floor(segmentProgress);
                let nextSegment = currentSegment + 1;

                if (nextSegment >= points.length) {
                    nextSegment = points.length - 1;
                }

                let p1 = points[currentSegment];
                let p2 = points[nextSegment];

                const segmentProgressNormalized = segmentProgress - currentSegment;
                const pos = interpolate(p1, p2, segmentProgressNormalized);
                planeModel.setCoords([pos.lng, pos.lat, pos.alt]);

                // Вычисляем угол поворота самолета
                const angle = calculateAngle(p1, p2);  // Угол направления движения самолета

                // Если включен режим следования камеры
                if (followCamera) {
                    // Камера будет следовать за самолетом, добавляем смещение по оси Z
                    const cameraLng = pos.lng + cameraOffset.x;   // Смещение камеры по долготе
                    const cameraLat = pos.lat + cameraOffset.y;   // Смещение камеры по широте
                    const cameraAltitude = pos.alt + cameraOffset.z;  // Смещение камеры по высоте

                    // Поворот камеры на 180 градусов относительно самолета (чтобы камера была сзади)
                    const adjustedBearing = angle + 90 ;  // Поворот камеры в противоположную сторону

                    map.jumpTo({
                        center: [cameraLng, cameraLat],
                        zoom: 15.0, //14.4
                        pitch: 55,  // Угол наклона камеры
                        bearing: adjustedBearing,  // Поворот камеры в направлении хвоста
                    });
                }
                if (window.towers){
                // Проверка на нахождение внутри сигнала
                const insideSignal = isInsideSignalDome(pos.lat, pos.lng, pos.alt);

                // Если самолет входит в радиус сигнала и еще не был внутри, запускаем таймер
                if (insideSignal && !isInsideSignal) {
                    isInsideSignal = true;
                    signalTimer = setInterval(updateTimer, 100);  // Запускаем таймер (обновляем каждую десятую долю)
                }

                // Если самолет выходит из радиуса сигнала и был внутри, останавливаем таймер
                if (!insideSignal && isInsideSignal) {
                    isInsideSignal = false;
                    clearInterval(signalTimer);  // Останавливаем таймер
                }
            }
                // Поворот и другие действия с самолетом
                const tilt = calculateTilt(p1, p2);
                planeModel.setRotation({ x: 90, y: angle * (180 / Math.PI), z: tilt * (180 / Math.PI) });

                window.tb.update();

                // Обновляем общее время полета
                const totalFlightTime = (elapsedTime / 1000).toFixed(2);  // Время в секундах
                document.getElementById('flightTime').textContent = `Общее время полета: ${totalFlightTime}s`;

                // Обновляем процент времени в сигнале
                const signalTimePercentage = (timeInsideSignal / totalFlightTime * 100).toFixed(2);
                document.getElementById('signalPercentage').textContent = `Процент времени в сигнале: ${signalTimePercentage}%`;
                // В функции animate, добавляем вызов обновления сигнала
                if (window.towers){
                updateSignalInfo(pos.lat, pos.lng, pos.alt);
                }
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    alert("Полет завершен!");
                    clearInterval(signalTimer);  // Останавливаем таймер по завершению полета
                }
            }

    // Функция для вычисления угла наклона по оси Z (по высоте)
    function calculateTilt(p1, p2) {
        const horizontalDistance = calculateDistance(p1.lat, p1.lng, p2.lat, p2.lng); // Горизонтальное расстояние между точками
        const heightDifference = p2.alt - p1.alt; // Разница по высоте
        return -1 * Math.atan2(heightDifference, horizontalDistance); // Угол наклона
    }
    
    // Функция для вычисления расстояния между двумя точками на поверхности Земли
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Радиус Земли в км
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c * 1000;  // Расстояние в метрах
    }
    
    // Функция для вычисления угла между двумя точками
    function calculateAngle(p1, p2) {
        const dx = p2.lng - p1.lng;
        const dy = p2.lat - p1.lat;
        return Math.atan2(dy, dx); // Возвращаем угол в радианах
    }
